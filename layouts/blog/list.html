{{ define "main" }} {{ partial "page-header" . }}

<section class="section">
  <div class="container">
    <div class="row gx-5">
      <div class="lg:col-8">
        <div class="row">
          {{ $paginator := .Paginate .RegularPages.ByDate.Reverse }} {{ range
          $paginator.Pages }}
          <div class="md:col-6 mb-8">
            {{ partial "components/blog-card" . }}
          </div>
          {{ end }}
        </div>
        {{ partial "components/pagination.html" . }}
      </div>
      <aside class="lg:col-4">
        {{ partial "widgets/section-sidebar" . }}
      </aside>
    </div>
  </div>
</section>
{{ end }}
